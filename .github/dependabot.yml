version: 2
updates:
  # docker-compose.yml's caddy image, now pinned to an exact version.
  # "docker-compose", not "docker": the latter only scans Dockerfiles, and
  # this repo has none, so the caddy pin was never bumped.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"

  # Actions used by the workflows in .github/workflows/ (lint, tests,
  # shellcheck) - keeps actions/checkout etc. current, which matters since
  # they run with repo access on every push/PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
